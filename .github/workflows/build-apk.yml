name: Build Own Pet APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract Android source
        run: |
          rm -rf android-source
          mkdir android-source
          unzip -q App-Android-source.zip -d android-source

      - name: Install Node dependencies
        working-directory: android-source
        run: npm install

      - name: Create Capacitor Android project
        working-directory: android-source
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: android-source
        run: npx cap sync android

      - name: Build APK
        working-directory: android-source/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: own-pet-debug-apk
          path: android-source/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
