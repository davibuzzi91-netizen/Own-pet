name: Build Own Pet APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Extract Android source
        run: unzip -q App-Android-source.zip -d android-source

      - name: Install dependencies
        working-directory: android-source
        run: npm install

      - name: Create Android project
        working-directory: android-source
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: android-source
        run: npx cap sync android

      - name: Build APK
        working-directory: android-source/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: own-pet-debug-apk
          path: android-source/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
